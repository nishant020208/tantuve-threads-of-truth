<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Deep indigo background -->
  <rect width="48" height="48" rx="8" fill="#1B2A4A"/>
  <!-- Loom threads - horizontal -->
  <line x1="8" y1="14" x2="40" y2="14" stroke="#D4A017" stroke-width="1.2" opacity="0.8"/>
  <line x1="8" y1="20" x2="40" y2="20" stroke="#D4A017" stroke-width="1.2" opacity="0.8"/>
  <line x1="8" y1="26" x2="40" y2="26" stroke="#D4A017" stroke-width="1.2" opacity="0.8"/>
  <line x1="8" y1="32" x2="40" y2="32" stroke="#D4A017" stroke-width="1.2" opacity="0.8"/>
  <!-- Warp threads - vertical -->
  <line x1="14" y1="8" x2="14" y2="40" stroke="#D4A017" stroke-width="1.2" opacity="0.6"/>
  <line x1="20" y1="8" x2="20" y2="40" stroke="#D4A017" stroke-width="1.2" opacity="0.6"/>
  <line x1="28" y1="8" x2="28" y2="40" stroke="#D4A017" stroke-width="1.2" opacity="0.6"/>
  <line x1="34" y1="8" x2="34" y2="40" stroke="#D4A017" stroke-width="1.2" opacity="0.6"/>
  <!-- Center diamond - madder crimson -->
  <rect x="19" y="19" width="10" height="10" rx="1" transform="rotate(45 24 24)" fill="#8B1E3F"/>
  <!-- Gold inner diamond -->
  <rect x="21" y="21" width="6" height="6" rx="0.5" transform="rotate(45 24 24)" fill="#D4A017"/>
</svg>
